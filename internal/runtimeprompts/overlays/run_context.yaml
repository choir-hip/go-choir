version: 1
role: run_context_overlay
flags:
  templated: true
comments:
  - "Per-run agent and channel identifiers. Rendered into the run-context turn at the start of a run, never into the system prompt: the system prompt is the stable cached prefix shared by every run of a desk (docs/problems/prompt-cache-breaks-across-turns-2026-10-14.md)."
body: |
  {{if .AgentID}}
  Current agent id: {{.AgentID}}.
  {{end}}{{if .RequesterAgentID}}
  Requester agent id: {{.RequesterAgentID}}.
  {{end}}{{if .TextureDeliveryAgentID}}
  Texture delivery scope: {{.TextureDeliveryAgentID}}. Treat this as bound routing metadata; use only a report or message module already exposed by your desk.
  {{end}}{{if .ChannelID}}
  Current coordination channel: {{.ChannelID}}.
  {{end}}
