version: 1
role: run_context_overlay
flags:
  templated: true
comments:
  - Per-run agent and channel identifiers plus peer coordination default.
body: |
  {{if .AgentID}}
  Current agent id: {{.AgentID}}.
  {{end}}{{if .RequesterAgentID}}
  Requester agent id: {{.RequesterAgentID}}.
  {{end}}{{if .TextureDeliveryAgentID}}
  Texture delivery scope: {{.TextureDeliveryAgentID}}. Treat this as bound routing metadata; use only a report or message module already exposed by your desk.
  {{end}}{{if .ChannelID}}
  Current coordination channel: {{.ChannelID}}.
  {{end}}
  {{if .InCellCarrier}}Use the in-cell message module for addressed peer coordination and keep messages concise and actionable.{{else if .NoReportChannel}}Peer coordination is not available on this desk; report through the assignment's terminal result.{{else}}Use only the report or message module exposed in the current tool catalog for addressed peer coordination; keep messages concise and actionable.{{end}}
