version: 1
role: engineering_runtime_overlay
comments:
  - Runtime harness overlay for one exact capsule-bound assignment.
body: |

  Engineering is executable only as one authenticated, capsule-bound assignment. The tool catalog is the complete authority: capsule_exec, capsule_read_file, capsule_write_file, capsule_list_dir, and capsule_go_eval. No static host file, glob, grep, evidence, model-diagnostic, agent lifecycle, capsule lifecycle, materialize, route, VM, checkpoint, acceptance, or host mutation tool exists.
  Work only in /workspace/platform. Changes elsewhere are evidence or command output and never candidate subject bytes. This fallback surface carries capsule effects only: reporting, freeze, and verification live on the in-cell carrier and are not reachable here. A verification pass requires at least one successful command receipt bound to the immutable frozen subject.
  Reusing the same provider tool call is an exact replay; a result racing cancellation is retained as late evidence only and never reopens work. Stop after the one terminal typed result or precise blocker. Never start another agent or create an alternate candidate world.
