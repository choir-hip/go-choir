# Developer Certificate of Origin check (docs: CONTRIBUTING.md).
#
# Every non-merge commit in the range must carry a "Signed-off-by: Name
# <email>" trailer (git commit -s). Enforced on pull requests from forks;
# report-only (warning, never a failure) on pushes to main and on pull
# requests from branches of this repository. A separate workflow on purpose:
# it does not touch ci.yml, its docs-only filters, or the staging deploy.
# No third-party action and no secrets: checkout plus git log.
name: DCO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  signoff:
    name: Signed-off-by check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Check commits for a Signed-off-by trailer
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          enforce=false
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
            if [[ "$PR_HEAD_REPO" != "$BASE_REPO" ]]; then
              enforce=true
            fi
          elif [[ -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != "$zero" ]] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            range="${PUSH_AFTER}^!"
          fi

          missing=0
          total=0
          while read -r sha; do
            [[ -n "$sha" ]] || continue
            total=$((total + 1))
            if ! git show -s --format=%B "$sha" \
                 | grep -Eq '^Signed-off-by: .+ <[^<>[:space:]]+@[^<>[:space:]]+>[[:space:]]*$'; then
              missing=$((missing + 1))
              subject="$(git show -s --format=%s "$sha")"
              echo "::warning title=DCO::${sha:0:12} is missing a Signed-off-by line: ${subject}"
            fi
          done < <(git rev-list --no-merges "$range")

          echo "checked ${total} commit(s) in ${range}; ${missing} without Signed-off-by (enforce=${enforce})"
          if [[ "$missing" -gt 0 && "$enforce" == "true" ]]; then
            echo "::error title=DCO::sign off every commit with 'git commit -s' (see CONTRIBUTING.md); to fix existing commits: git rebase --signoff main && git push --force-with-lease"
            exit 1
          fi
