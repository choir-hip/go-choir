name: Put PostgreSQL server binaries on PATH
description: dbxtest.Postgres starts a throwaway cluster with initdb and pg_ctl from PATH (docs/design/data-system-build-sheet-2026-10-30.md, decision 13)
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        # GitHub's ubuntu images ship PostgreSQL binaries (service disabled);
        # install the distribution package only if they are missing.
        bindir=""
        for d in /usr/lib/postgresql/*/bin; do
          if [[ -x "$d/initdb" && -x "$d/pg_ctl" ]]; then bindir="$d"; fi
        done
        if [[ -z "$bindir" ]]; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql
          for d in /usr/lib/postgresql/*/bin; do
            if [[ -x "$d/initdb" && -x "$d/pg_ctl" ]]; then bindir="$d"; fi
          done
        fi
        [[ -n "$bindir" ]] || { echo "no PostgreSQL server binaries found" >&2; exit 1; }
        # pgvector 0.8.0 or later (halfvec, HNSW, iterative index scans:
        # internal/platform/vector_search.go vectorMinPgvector) for the vector
        # index's tests. The version is compared numerically, so 0.10 passes.
        # PGDG's postgresql-N-pgvector is 0.8.x on the runner images' release.
        major="$(basename "$(dirname "$bindir")")"
        control="/usr/share/postgresql/$major/extension/vector.control"
        pgvector_ok() {
          local v
          v="$(sed -n "s/^default_version *= *'\([0-9.]*\)'.*/\1/p" "$control" 2>/dev/null | head -n1)"
          [[ -n "$v" && "$(printf '%s\n%s\n' 0.8.0 "$v" | sort -V | head -n1)" == "0.8.0" ]]
        }
        if ! pgvector_ok; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "postgresql-$major-pgvector"
        fi
        pgvector_ok || { echo "pgvector 0.8.0 or later is not installed for PostgreSQL $major (found: $(sed -n "s/^default_version.*'\(.*\)'.*/\1/p" "$control" 2>/dev/null))" >&2; exit 1; }
        echo "$bindir" >> "$GITHUB_PATH"
        "$bindir/pg_ctl" --version
