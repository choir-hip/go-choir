name: Put PostgreSQL server binaries on PATH
description: dbxtest.Postgres starts a throwaway cluster with initdb and pg_ctl from PATH (docs/design/data-system-build-sheet-2026-10-30.md, decision 13)
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        # GitHub's ubuntu images ship PostgreSQL binaries (service disabled);
        # install the distribution package only if they are missing.
        bindir=""
        for d in /usr/lib/postgresql/*/bin; do
          if [[ -x "$d/initdb" && -x "$d/pg_ctl" ]]; then bindir="$d"; fi
        done
        if [[ -z "$bindir" ]]; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql
          for d in /usr/lib/postgresql/*/bin; do
            if [[ -x "$d/initdb" && -x "$d/pg_ctl" ]]; then bindir="$d"; fi
          done
        fi
        [[ -n "$bindir" ]] || { echo "no PostgreSQL server binaries found" >&2; exit 1; }
        # pgvector with halfvec and HNSW (0.7 or later) for the vector index's
        # tests (internal/platform/vector_*_test.go). The PGDG repository the
        # runner images use carries it; the distribution's 0.6 does not.
        major="$(basename "$(dirname "$bindir")")"
        if ! ls /usr/share/postgresql/"$major"/extension/vector--0.[7-9]*.sql >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "postgresql-$major-pgvector"
        fi
        ls /usr/share/postgresql/"$major"/extension/vector--0.[7-9]*.sql >/dev/null || { echo "pgvector 0.7 or later (halfvec) is not installed for PostgreSQL $major" >&2; exit 1; }
        echo "$bindir" >> "$GITHUB_PATH"
        "$bindir/pg_ctl" --version
