name: Set up Go with workload build cache
description: Refresh compiled Go work without letting lightweight jobs seed heavy caches
inputs:
  lane:
    description: Workload and build mode; only jobs compiling the same packages may share
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      id: go
      with:
        go-version-file: go.mod
        cache: false
    - id: image
      shell: bash
      run: echo "os=${ImageOS:?hosted runner image required}" >> "$GITHUB_OUTPUT"
    # Source changes rotate immutable entries. Prefix restore retains unchanged
    # dependencies; Go validates cached objects and all tests still execute.
    # Keep the OS image and actual compiler in the prefix (including cgo ABI).
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: choir-go-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.os }}-${{ steps.go.outputs.go-version }}-${{ inputs.lane }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ hashFiles('**/*.go', '**/*.s', '**/*.c', '**/*.h', 'scripts/go-test-*', '.github/actions/setup-go-build-cache/action.yml') }}
        restore-keys: |
          choir-go-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.os }}-${{ steps.go.outputs.go-version }}-${{ inputs.lane }}-${{ hashFiles('go.mod', 'go.sum') }}-
    # Marks when the restore finished, for scripts/ci-prune-go-cache.
    - shell: bash
      run: date +%s > "${RUNNER_TEMP:?}/go-cache-restored-at"
