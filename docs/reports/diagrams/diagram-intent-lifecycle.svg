<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350">
  <defs>
    <style>
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #1e293b; font-weight: 600; }
      .step-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #ffffff; }
      .arrow { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrow-blue); }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="350" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Phase 1: In-Cell Execution -->
  <g transform="translate(25, 25)">
    <rect width="250" height="300" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="16" y="14" width="75" height="22" rx="11" fill="#3b82f6"/>
    <text x="53" y="29" class="step-badge" text-anchor="middle">PHASE 1</text>
    <text x="16" y="58" class="text-title">In-Cell Execution</text>
    <text x="16" y="75" class="text-sub">Inside the in-capsule Yaegi worker</text>

    <rect x="14" y="88" width="222" height="68" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="22" y="106" class="text-code" fill="#059669">choir.ReadFile / Exec</text>
    <text x="22" y="122" class="text-sub">Synchronous guest-local syscalls</text>
    <text x="22" y="138" class="text-sub">Zero blocking cross-calls mid-cell</text>

    <rect x="14" y="165" width="222" height="118" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="22" y="183" class="text-code" fill="#7c3aed">choir.Message / Complete</text>
    <text x="22" y="200" class="text-sub">• Appends to in-memory tray</text>
    <text x="22" y="216" class="text-sub">• Mints local correlation ID</text>
    <text x="22" y="232" class="text-sub">• Enforces quotas (16 max)</text>
    <text x="22" y="248" class="text-sub">• Returns in microseconds</text>
    <text x="22" y="264" class="text-sub">  (No blocking wait; no deadlocks)</text>
  </g>

  <!-- Arrow Phase 1 -> Phase 2 -->
  <path d="M 285 165 L 315 165" class="arrow"/>

  <!-- Phase 2: Frame Packaging -->
  <g transform="translate(325, 25)">
    <rect width="240" height="300" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="16" y="14" width="75" height="22" rx="11" fill="#3b82f6"/>
    <text x="53" y="29" class="step-badge" text-anchor="middle">PHASE 2</text>
    <text x="16" y="58" class="text-title">Cell Completion &amp; Frame</text>
    <text x="16" y="75" class="text-sub">Crosses capsule → autoputer socket</text>

    <rect x="14" y="88" width="212" height="195" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="22" y="110" class="text-title" font-size="12">Packaged Result Frame</text>
    <text x="22" y="133" class="text-code">• Output Text / Return Val</text>
    <text x="22" y="154" class="text-code">• Execution Exit Status</text>
    <text x="22" y="175" class="text-code">• Execution Manifest:</text>
    <text x="32" y="192" class="text-sub">  commands run, exit codes,</text>
    <text x="32" y="207" class="text-sub">  stdout/stderr digests</text>
    <text x="22" y="228" class="text-code">• Staged Intent Tray Batch</text>
    <text x="22" y="254" class="text-sub" fill="#2563eb" font-weight="600">Atomic handover to autoputer</text>
  </g>

  <!-- Arrow Phase 2 -> Phase 3 -->
  <path d="M 575 165 L 605 165" class="arrow"/>

  <!-- Phase 3: Guest Runtime Reduction -->
  <g transform="translate(615, 25)">
    <rect width="240" height="300" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <rect x="16" y="14" width="75" height="22" rx="11" fill="#15803d"/>
    <text x="53" y="29" class="step-badge" text-anchor="middle">PHASE 3</text>
    <text x="16" y="58" class="text-title">Guest Reducer &amp; Channels</text>
    <text x="16" y="75" class="text-sub">Inside autoputer (Guest MicroVM)</text>

    <rect x="14" y="88" width="212" height="62" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="22" y="106" class="text-title" font-size="11">1. Envelope &amp; Validate</text>
    <text x="22" y="122" class="text-sub">Stamps sender, timestamp,</text>
    <text x="22" y="137" class="text-sub">direction, and fixed schema.</text>

    <rect x="14" y="158" width="212" height="62" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="22" y="176" class="text-title" font-size="11">2. Durable Dolt Log</text>
    <text x="22" y="192" class="text-sub">Commits to Dolt event table.</text>
    <text x="22" y="207" class="text-sub">Survives reboots &amp; restores.</text>

    <rect x="14" y="228" width="212" height="58" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="22" y="246" class="text-title" font-size="11">3. Go Channel &amp; Wake</text>
    <text x="22" y="262" class="text-sub">Pushes to recipient mailbox chan;</text>
    <text x="22" y="277" class="text-sub">schedules recipient LLM turn.</text>
  </g>
</svg>