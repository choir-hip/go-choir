<!doctype html><html><head><meta charset="utf-8"><title>heavy</title>
<style>body{font-family:sans-serif}.c{display:inline-block;width:110px;height:70px;margin:4px;border-radius:8px;background:linear-gradient(135deg,#6af,#f6a);animation:s 2s infinite alternate}@keyframes s{to{transform:rotate(6deg) scale(1.05)}}canvas{display:block}</style></head>
<body><h1>Heavy synthetic page</h1><div id="g"></div><script>
const g=document.getElementById('g');
for(let i=0;i<4000;i++){const d=document.createElement('div');d.className='c';d.textContent='card '+i;g.appendChild(d)}
for(let k=0;k<6;k++){const c=document.createElement('canvas');c.width=1200;c.height=600;document.body.appendChild(c);const x=c.getContext('2d');for(let j=0;j<3000;j++){x.fillStyle=`hsl(${j%360},70%,50%)`;x.fillRect(Math.random()*1200,Math.random()*600,20,20)}}
window.big=[];for(let i=0;i<50;i++)window.big.push(new Array(100000).fill(i));
</script></body></html>
