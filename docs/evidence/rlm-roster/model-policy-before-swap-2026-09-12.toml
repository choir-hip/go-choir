# Choir model policy
# This computer-owned file maps agent roles to provider/model choices.
# Provider secrets stay server-owned; this file names models only.
# Optional max_tokens requests an explicit per-call budget. Omit it for provider
# defaults, especially OpenAI-compatible chat completions.

[defaults]
fallback_provider = "chatgpt"
fallback_model = "gpt-5.6-luna"
reasoning = "low"

[roles.conductor]
provider = "chatgpt"
model = "gpt-5.6-luna"
reasoning = "low"

[roles.texture]
provider = "chatgpt"
model = "gpt-5.6-luna"
reasoning = "low"

[roles.super]
provider = "chatgpt"
model = "gpt-5.6-luna"
reasoning = "high"

[roles.co-super]
provider = "deepseek"
model = "deepseek-v4-flash"

[roles.researcher]
provider = "chatgpt"
model = "gpt-5.6-luna"
reasoning = "low"

[roles.processor]
provider = "chatgpt"
model = "gpt-5.6-luna"
reasoning = "low"

[roles.reconciler]
provider = "chatgpt"
model = "gpt-5.6-luna"
reasoning = "low"

[roles.verifier]
provider = "deepseek"
model = "deepseek-v4-flash"
requires = ["text", "tool_use"]

[roles.verifier_multimodal]
provider = "xiaomi"
model = "mimo-v2.5"
requires = ["image", "tool_use"]
